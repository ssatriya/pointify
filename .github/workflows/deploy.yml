name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            DEPLOY_DIR="/var/www/pointify"

            if [ ! -d "$DEPLOY_DIR" ]; then
              echo ">>> First deploy: cloning repo..."
              sudo mkdir -p /var/www
              sudo chown -R $USER:$USER /var/www
              git clone https://github.com/ssatriya/pointify.git $DEPLOY_DIR
              cd $DEPLOY_DIR

              composer install --no-dev --optimize-autoloader --no-interaction

              php artisan key:generate
              php artisan storage:link
            fi

            cd $DEPLOY_DIR

            # Always update .env from secret
            echo "${{ secrets.VPS_ENV_FILE }}" > .env

            git fetch origin
            git reset --hard origin/main

            composer install --no-dev --optimize-autoloader --no-interaction

            # Fix permissions FIRST (before any artisan commands)
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # Build frontend assets
            pnpm install --frozen-lockfile
            NODE_OPTIONS=--max-old-space-size=512 pnpm run build

            # Maintenance mode
            php artisan down --retry=5 --secret="${{ secrets.MAINTENANCE_SECRET }}"

            # Database migrations
            php artisan migrate --force

            # Clear & rebuild caches
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Restart queue workers
            php artisan queue:restart

            # Reset OPcache
            sudo systemctl reload php8.3-fpm

            # Exit maintenance mode
            php artisan up

            echo ">>> Deploy completed successfully!"
